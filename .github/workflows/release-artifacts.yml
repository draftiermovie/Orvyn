name: Release artifacts

on:
  workflow_dispatch:
  push:
    branches: ["codex/build-v*"]

permissions:
  contents: read

jobs:
  installers:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          rustup default 1.97.1-x86_64-pc-windows-msvc
      - name: Initialize portable configuration
        run: ./scripts/initialize-config.ps1
      - name: Install locked web dependencies
        run: |
          . ./scripts/usb-environment.ps1
          Push-Location apps/web-ui
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          } finally { Pop-Location }
      - name: Check TypeScript
        run: node apps/web-ui/node_modules/typescript/bin/tsc --project apps/web-ui/tsconfig.json --noEmit --incremental false
      - name: Build desktop web bundle
        run: ./scripts/build-ui.ps1
      - name: Prepare locked Cargo cache
        run: ./scripts/prepare-cargo-cache.ps1
      - name: Run native tests offline
        run: |
          . ./scripts/rust-environment.ps1
          cargo test --manifest-path apps/manager/Cargo.toml --release --locked --offline --jobs 4 -- --test-threads=2
      - name: Build and stage desktop executable
        run: |
          ./scripts/build-desktop.ps1
          ./scripts/deploy-desktop.ps1
      - name: Prepare verified model, runtime, and compiler
        run: ./scripts/prepare-release-inputs.ps1
      - name: Build installers and record provenance
        id: package
        run: ./scripts/build-release-artifacts.ps1 -Compiler ./tools/innosetup-6.7.4/ISCC.exe
      - name: Upload installers, checksums, and manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libxkbcommon-dev libwayland-dev xvfb xauth
      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
      - name: Build desktop web bundle
        run: |
          bash scripts/init-config.sh
          bash scripts/build-ui.sh
      - name: Run native tests and build the desktop app
        run: |
          source scripts/usb-environment.sh
          cargo test --manifest-path apps/manager/Cargo.toml --release --locked -- --test-threads=2
          bash scripts/build-desktop.sh
      - name: Package and smoke-test the Linux installer
        id: package
        env:
          # Xvfb has no GPU-backed buffers. Use WebKitGTK's software path in CI.
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          bash scripts/deploy-desktop.sh
          bash scripts/package-portable.sh
          bash scripts/build-installer.sh
          version=$(node -p 'require("./config/settings.example.json").app.version')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          printf '%s\n' "$commit" > dist/Orvyn-portable-linux/source-commit.txt
          smoke_dir=$(mktemp -d)
          bash dist/Orvyn-installer.sh --yes --prefix "$smoke_dir/Orvyn"
          xvfb-run -a timeout 60 "$smoke_dir/Orvyn/start-orvyn.sh" self-test
          node -e 'const s = require(process.argv[1]); if (!s.ui_loaded) throw Error("Orvyn webview did not load")' \
            "$smoke_dir/Orvyn/data/desktop-session.json"
          archive="Orvyn-$version-linux-$(uname -m)-$commit.tar.gz"
          tar -C dist -czf "dist/$archive" Orvyn-portable-linux Orvyn-installer.sh
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - name: Upload Linux package and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Orvyn-linux-x86_64-${{ github.sha }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    uses: ./.github/workflows/macos-ci.yml
    with:
      upload_artifacts: true
